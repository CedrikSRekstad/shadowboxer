<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>2 Player Combat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Title Screen -->
    <div id="title-screen">
        <div class="title-bg"></div>
        <h1>2 PLAYER<br>COMBAT</h1>
        <p class="subtitle">2 Player Battle</p>
        <p class="subtitle-small">Best of 3 Rounds</p>
        <button id="start-btn" class="menu-btn">QUICK FIGHT</button>
        <button id="solo-btn" class="menu-btn menu-btn-solo">VS COMPUTER</button>
        <button id="customize-btn" class="menu-btn menu-btn-alt">CUSTOMIZE</button>
    </div>

    <!-- Difficulty Select Screen -->
    <div id="difficulty-screen" class="hidden">
        <h2 class="diff-title">AI DIFFICULTY</h2>
        <div class="difficulty-options">
            <button class="menu-btn diff-btn" data-diff="easy">😊 EASY</button>
            <button class="menu-btn diff-btn" data-diff="medium">😎 MEDIUM</button>
            <button class="menu-btn diff-btn" data-diff="hard">😈 HARD</button>
        </div>
        <button id="diff-back-btn" class="menu-btn menu-btn-small">BACK</button>
    </div>

    <!-- Customize Screen -->
    <div id="customize-screen" class="hidden">
        <h2 class="custom-title">CUSTOMIZE</h2>

        <div class="custom-section">
            <h3 class="custom-label">WORLD</h3>
            <div class="world-row" id="world-row"></div>
        </div>

        <div class="custom-section">
            <h3 class="custom-label player1-label">P1 OUTFITS</h3>
            <div class="outfit-row">
                <div class="outfit-slot" data-player="1" data-round="0"><span class="round-label">R1</span><span class="outfit-name" id="p1-outfit-0">Street</span></div>
                <div class="outfit-slot" data-player="1" data-round="1"><span class="round-label">R2</span><span class="outfit-name" id="p1-outfit-1">Casual</span></div>
                <div class="outfit-slot" data-player="1" data-round="2"><span class="round-label">R3</span><span class="outfit-name" id="p1-outfit-2">Ninja</span></div>
            </div>
        </div>

        <div class="custom-section">
            <h3 class="custom-label player2-label">P2 OUTFITS</h3>
            <div class="outfit-row">
                <div class="outfit-slot" data-player="2" data-round="0"><span class="round-label">R1</span><span class="outfit-name" id="p2-outfit-0">Street</span></div>
                <div class="outfit-slot" data-player="2" data-round="1"><span class="round-label">R2</span><span class="outfit-name" id="p2-outfit-1">Casual</span></div>
                <div class="outfit-slot" data-player="2" data-round="2"><span class="round-label">R3</span><span class="outfit-name" id="p2-outfit-2">Ninja</span></div>
            </div>
        </div>

        <div class="custom-buttons">
            <button id="custom-fight-btn" class="menu-btn">START FIGHT</button>
            <button id="custom-back-btn" class="menu-btn menu-btn-small">BACK</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden">
        <!-- Player 2 HUD (top) -->
        <div id="p2-hud" class="hud hud-top">
            <div class="health-bar-container">
                <div class="fighter-portrait p2-portrait" id="p2-portrait">P2</div>
                <div id="p2-health-bar" class="health-bar p2-color"></div>
                <div class="round-indicators" id="p2-rounds">
                    <span class="round-dot"></span>
                    <span class="round-dot"></span>
                </div>
            </div>
        </div>

        <!-- Player 2 Controls (top, inverted) -->
        <div id="p2-controls" class="controls controls-top">
            <div class="controls-grid">
                <div class="joystick-col" id="p2-joystick-area">
                    <div class="joystick-base" id="p2-joystick-base">
                        <div class="joystick-knob" id="p2-joystick-knob"></div>
                    </div>
                </div>
                <div class="action-col">
                    <button class="ctrl-btn attack-btn" data-player="2" data-action="attack">ATK</button>
                    <button class="ctrl-btn grapple-btn" data-player="2" data-action="grapple">GRAB</button>
                    <button class="ctrl-btn dodge-btn" data-player="2" data-action="dodge">DODGE</button>
                </div>
            </div>
        </div>

        <!-- Game Canvas -->
        <canvas id="game-canvas"></canvas>

        <!-- Exit button -->
        <button id="exit-fight-btn" class="exit-btn">✕</button>

        <!-- Hit flash overlay -->
        <div id="hit-flash"></div>

        <!-- State announcement -->
        <div id="announcement" class="hidden">
            <div class="announce-bg"></div>
            <span class="announce-text"></span>
        </div>

        <!-- Player 1 Controls (bottom) -->
        <div id="p1-controls" class="controls controls-bottom">
            <div class="controls-grid">
                <div class="joystick-col" id="p1-joystick-area">
                    <div class="joystick-base" id="p1-joystick-base">
                        <div class="joystick-knob" id="p1-joystick-knob"></div>
                    </div>
                </div>
                <div class="action-col">
                    <button class="ctrl-btn attack-btn" data-player="1" data-action="attack">ATK</button>
                    <button class="ctrl-btn grapple-btn" data-player="1" data-action="grapple">GRAB</button>
                    <button class="ctrl-btn dodge-btn" data-player="1" data-action="dodge">DODGE</button>
                </div>
            </div>
        </div>

        <!-- Player 1 HUD (bottom) -->
        <div id="p1-hud" class="hud hud-bottom">
            <div class="health-bar-container">
                <div class="fighter-portrait p1-portrait">P1</div>
                <div id="p1-health-bar" class="health-bar p1-color"></div>
                <div class="round-indicators" id="p1-rounds">
                    <span class="round-dot"></span>
                    <span class="round-dot"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="hidden">
        <h1 id="winner-text">PLAYER 1 WINS!</h1>
        <button id="rematch-btn" class="menu-btn">REMATCH</button>
        <button id="menu-btn" class="menu-btn">MENU</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
