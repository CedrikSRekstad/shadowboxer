<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stickman Fighter - Cgames</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/game-shell.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Title Screen -->
    <div id="title-screen" class="screen active">
        <div class="game-header">
            <div class="game-header-left">
                <button class="btn-icon shell-back" title="Back">&#8592;</button>
            </div>
            <div class="game-header-center">
                <span class="game-title-bar">Stickman Fighter</span>
            </div>
            <div class="game-header-right">
                <button class="btn-icon shell-theme-toggle" title="Toggle theme"></button>
                <button class="btn-icon shell-sound-toggle" title="Toggle sound"></button>
            </div>
        </div>
        <div class="mode-screen">
            <div class="title-icon">&#9876;&#65039;</div>
            <p class="title-subtitle">Fight through side-scrolling hazards!</p>
            <div class="mode-buttons">
                <button class="btn btn-primary" id="btn-story">Story</button>
                <button class="btn btn-secondary" id="btn-local">Local</button>
            </div>
            <div class="local-options hidden" id="local-options">
                <p class="diff-label">Local Mode</p>
                <div class="mode-buttons">
                    <button class="btn btn-primary" id="btn-local-2p">2 Players</button>
                    <button class="btn btn-accent" id="btn-local-ai">vs AI</button>
                </div>
            </div>
            <div class="controls-hint">
                <div class="controls-row"><span class="hint-label">P1</span> A/D move &bull; W jump &bull; S block &bull; F punch &bull; G kick</div>
                <div class="controls-row"><span class="hint-label">P2</span> &#8592;&#8594; move &bull; &#8593; jump &bull; &#8595; block &bull; K punch &bull; L kick</div>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <div class="game-header-left">
                <button class="btn-icon" id="btn-back-game" title="Menu">&#8592;</button>
            </div>
            <div class="game-header-center">
                <div class="score-hud">
                    <span class="p1-label">P1</span>
                    <span class="p1-score" id="score-p1">0</span>
                    <span class="round-info" id="round-info">Round 1</span>
                    <span class="p2-score" id="score-p2">0</span>
                    <span class="p2-label">P2</span>
                </div>
            </div>
            <div class="game-header-right">
                <button class="btn-icon" id="btn-pause" title="Pause">&#10074;&#10074;</button>
                <button class="btn-icon shell-theme-toggle" title="Toggle theme"></button>
                <button class="btn-icon shell-sound-toggle" title="Toggle sound"></button>
            </div>
        </div>
        <div class="health-bars">
            <div class="health-bar p1-bar">
                <div class="health-fill p1-health-fill" id="p1-health" style="width:100%"></div>
            </div>
            <div class="health-vs" id="health-vs">VS</div>
            <div class="health-bar p2-bar">
                <div class="health-fill p2-health-fill" id="p2-health" style="width:100%"></div>
            </div>
        </div>
        <div class="canvas-container" id="canvas-container">
            <canvas id="game-canvas"></canvas>
        </div>
        <div class="countdown-overlay hidden" id="countdown-overlay">
            <div class="countdown-number" id="countdown-number">3</div>
        </div>
        <div class="pause-overlay hidden" id="pause-overlay">
            <div class="pause-box">
                <div class="pause-title">Paused</div>
                <button class="btn btn-primary" id="btn-resume">Resume</button>
                <button class="btn btn-secondary" id="btn-quit">Quit</button>
            </div>
        </div>
        <div class="round-overlay hidden" id="round-overlay">
            <div class="round-result" id="round-result">Player 1 Wins!</div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen">
        <div class="game-header">
            <div class="game-header-left"></div>
            <div class="game-header-center">
                <span class="game-title-bar">Game Over</span>
            </div>
            <div class="game-header-right">
                <button class="btn-icon shell-theme-toggle" title="Toggle theme"></button>
                <button class="btn-icon shell-sound-toggle" title="Toggle sound"></button>
            </div>
        </div>
        <div class="gameover-content">
            <div class="gameover-icon" id="gameover-icon">&#9876;&#65039;</div>
            <div class="gameover-title" id="gameover-title">Game Over</div>
            <div class="gameover-sub" id="gameover-sub">Score: 0</div>
            <div class="gameover-buttons">
                <button class="btn btn-primary" id="btn-play-again">Play Again</button>
                <button class="btn btn-secondary" id="btn-go-menu">Menu</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script src="../shared/audio.js"></script>
    <script src="../shared/game-shell.js"></script>
    <script src="game.js"></script>
</body>
</html>
