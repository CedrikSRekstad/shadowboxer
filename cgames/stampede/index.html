<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stampede - Cgames</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/game-shell.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast" class="toast hidden"></div>

    <!-- Title Screen -->
    <div id="title-screen" class="screen active">
        <div class="game-header">
            <div class="game-header-left">
                <button class="btn-icon shell-back" title="Back">&#8592;</button>
            </div>
            <div class="game-header-center">
                <span class="game-title-bar">Stampede</span>
            </div>
            <div class="game-header-right">
                <button class="btn-icon shell-sound-toggle" title="Sound"></button>
                <button class="btn-icon shell-theme-toggle" title="Theme"></button>
            </div>
        </div>
        <div class="mode-screen">
            <div class="title-logo">
                <div class="title-icon">&#127939;</div>
                <h2>Stampede</h2>
                <p class="title-subtitle">Run, jump, duck... survive!</p>
            </div>
            <div class="mode-buttons">
                <button class="btn btn-primary" id="btn-1p">1 Player</button>
                <button class="btn btn-accent" id="btn-2p">2 Players</button>
            </div>
            <div class="controls-hint">
                <p>P1: W jump / S duck &nbsp; P2: &#8593; jump / &#8595; duck</p>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <div class="game-header-left">
                <button class="btn-icon" id="btn-pause" title="Pause">&#10074;&#10074;</button>
            </div>
            <div class="game-header-center">
                <div class="score-hud" id="game-hud">
                    <span class="p1-label" id="hud-p1">P1: 0m</span>
                    <span class="separator hidden" id="hud-sep">|</span>
                    <span class="p2-label hidden" id="hud-p2">P2: 0m</span>
                </div>
            </div>
            <div class="game-header-right">
                <button class="btn-icon shell-sound-toggle" title="Sound"></button>
            </div>
        </div>
        <div class="canvas-container" id="canvas-container">
            <canvas id="game-canvas"></canvas>
        </div>
        <!-- Touch zones -->
        <div class="touch-controls" id="touch-controls">
            <div class="touch-zone touch-zone-left" id="touch-left">
                <div class="touch-label">P1</div>
                <div class="touch-arrows">
                    <div class="touch-btn" id="touch-p1-jump">&#8593; JUMP</div>
                    <div class="touch-btn" id="touch-p1-duck">&#8595; DUCK</div>
                </div>
            </div>
            <div class="touch-zone touch-zone-right" id="touch-right">
                <div class="touch-label">P2</div>
                <div class="touch-arrows">
                    <div class="touch-btn" id="touch-p2-jump">&#8593; JUMP</div>
                    <div class="touch-btn" id="touch-p2-duck">&#8595; DUCK</div>
                </div>
            </div>
        </div>
        <!-- Pause overlay -->
        <div class="pause-overlay hidden" id="pause-overlay">
            <h2>Paused</h2>
            <div class="game-over-buttons">
                <button class="btn btn-primary" id="btn-resume">Resume</button>
                <button class="btn btn-secondary" id="btn-quit">Quit</button>
            </div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen">
        <div class="game-header">
            <div class="game-header-left">
                <button class="btn-icon shell-back" title="Back">&#8592;</button>
            </div>
            <div class="game-header-center">
                <span class="game-title-bar">Stampede</span>
            </div>
            <div class="game-header-right">
                <button class="btn-icon shell-sound-toggle" title="Sound"></button>
                <button class="btn-icon shell-theme-toggle" title="Theme"></button>
            </div>
        </div>
        <div class="game-over-overlay" style="position:relative; flex:1;">
            <h2 id="gameover-title">Game Over</h2>
            <div class="score-display" id="gameover-scores"></div>
            <div class="game-over-buttons">
                <button class="btn btn-primary" id="btn-retry">Play Again</button>
                <button class="btn btn-secondary" id="btn-menu">Menu</button>
            </div>
        </div>
    </div>

    <script src="../shared/audio.js"></script>
    <script src="../shared/game-shell.js"></script>
    <script src="game.js"></script>
</body>
</html>
