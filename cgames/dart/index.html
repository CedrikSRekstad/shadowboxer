<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dart - Cgames</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/game-shell.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Title Screen -->
    <div id="title-screen" class="screen active">
        <div class="game-header">
            <div class="game-header-left">
                <button class="btn-icon shell-back" title="Back">&#8592;</button>
            </div>
            <div class="game-header-center">
                <span class="game-title-bar">Dart</span>
            </div>
            <div class="game-header-right">
                <button class="btn-icon shell-theme-toggle" title="Toggle theme"></button>
                <button class="btn-icon shell-sound-toggle" title="Toggle sound"></button>
            </div>
        </div>
        <div class="mode-screen">
            <div class="title-logo">
                <div class="title-icon">&#127919;</div>
                <h2>Dart</h2>
                <p class="title-subtitle">Aim. Throw. Score!</p>
            </div>
            <div class="mode-buttons" id="player-select">
                <button class="btn btn-primary" id="btn-1p">1 Player</button>
                <button class="btn btn-secondary" id="btn-2p">2 Players</button>
            </div>
            <div class="mode-buttons hidden" id="mode-select">
                <p class="mode-label">Select Game Mode</p>
                <button class="btn btn-primary" data-mode="301">301</button>
                <button class="btn btn-secondary" data-mode="501">501</button>
                <button class="btn btn-accent" data-mode="free">Free Play (10 Rounds)</button>
                <button class="btn btn-secondary btn-small" id="btn-back-players">Back</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <div class="game-header-left">
                <button class="btn-icon" id="btn-pause" title="Pause">&#10074;&#10074;</button>
            </div>
            <div class="game-header-center">
                <div class="dart-score-hud">
                    <div class="dart-player-hud p1-hud" id="p1-hud">
                        <span class="dart-player-name p1-label">P1</span>
                        <span class="dart-player-score" id="hud-p1-score">301</span>
                    </div>
                    <div class="dart-turn-info" id="turn-info">
                        <span id="turn-darts">Dart 1/3</span>
                    </div>
                    <div class="dart-player-hud p2-hud hidden" id="p2-hud">
                        <span class="dart-player-name p2-label">P2</span>
                        <span class="dart-player-score" id="hud-p2-score">301</span>
                    </div>
                </div>
            </div>
            <div class="game-header-right">
                <button class="btn-icon shell-theme-toggle" title="Toggle theme"></button>
                <button class="btn-icon shell-sound-toggle" title="Toggle sound"></button>
            </div>
        </div>
        <div class="canvas-container" id="canvas-container">
            <canvas id="game-canvas"></canvas>
        </div>
        <div class="dart-throw-info" id="throw-info">
            <span id="last-throw-text">Press Space / Tap to throw</span>
        </div>
        <!-- Pause overlay -->
        <div class="pause-overlay hidden" id="pause-overlay">
            <h2>Paused</h2>
            <div class="game-over-buttons">
                <button class="btn btn-primary" id="btn-resume">Resume</button>
                <button class="btn btn-secondary" id="btn-quit">Quit</button>
            </div>
        </div>
        <!-- Bust overlay -->
        <div class="bust-overlay hidden" id="bust-overlay">
            <h2>BUST!</h2>
            <p>Score reverted to start of turn</p>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen">
        <div class="game-header">
            <div class="game-header-left">
                <button class="btn-icon shell-back" title="Back">&#8592;</button>
            </div>
            <div class="game-header-center">
                <span class="game-title-bar">Dart</span>
            </div>
            <div class="game-header-right">
                <button class="btn-icon shell-theme-toggle" title="Toggle theme"></button>
                <button class="btn-icon shell-sound-toggle" title="Toggle sound"></button>
            </div>
        </div>
        <div class="game-over-overlay" style="position:relative; flex:1;">
            <h2 id="winner-text">Player 1 Wins!</h2>
            <div class="score-display" id="final-score">0 darts thrown</div>
            <div class="game-over-buttons">
                <button class="btn btn-primary" id="btn-play-again">Play Again</button>
                <button class="btn btn-secondary" id="btn-menu">Menu</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="../shared/audio.js"></script>
    <script src="../shared/game-shell.js"></script>
    <script src="game.js"></script>
</body>
</html>
