<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 - Cgames</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/game-shell.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Title Screen -->
    <div id="title-screen" class="screen active">
        <div class="game-header">
            <div class="game-header-left">
                <button class="btn-icon shell-back" title="Back">&#8592;</button>
            </div>
            <div class="game-header-center">
                <span class="game-title-bar">2048</span>
            </div>
            <div class="game-header-right">
                <button class="btn-icon shell-theme-toggle" title="Toggle theme"></button>
                <button class="btn-icon shell-sound-toggle" title="Toggle sound"></button>
            </div>
        </div>
        <div class="mode-screen">
            <div class="title-logo">
                <div class="title-tile t-2">2</div>
                <div class="title-tile t-0">0</div>
                <div class="title-tile t-4">4</div>
                <div class="title-tile t-8">8</div>
            </div>
            <p class="title-subtitle">Slide & merge tiles to reach 2048!</p>
            <div class="mode-buttons">
                <button class="btn btn-primary" id="btn-1p">1 Player</button>
                <button class="btn btn-secondary" id="btn-2p">2 Player Race</button>
            </div>
        </div>
    </div>

    <!-- Game Screen (1P) -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <div class="game-header-left">
                <button class="btn-icon" id="btn-back-game" title="Menu">&#8592;</button>
            </div>
            <div class="game-header-center">
                <div class="hud-score">
                    <span class="hud-label">Score</span>
                    <span class="hud-value" id="hud-score">0</span>
                </div>
                <div class="hud-best">
                    <span class="hud-label">Best</span>
                    <span class="hud-value" id="hud-best">0</span>
                </div>
            </div>
            <div class="game-header-right">
                <button class="btn-icon" id="btn-restart" title="Restart">&#8635;</button>
                <button class="btn-icon shell-theme-toggle" title="Toggle theme"></button>
                <button class="btn-icon shell-sound-toggle" title="Toggle sound"></button>
            </div>
        </div>
        <div class="game-area">
            <div class="grid-wrapper">
                <div class="grid-container" id="grid-1p">
                    <div class="grid-bg">
                        <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
                        <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
                        <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
                        <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
                    </div>
                    <div class="tile-layer" id="tiles-1p"></div>
                </div>
            </div>
        </div>
        <!-- Win overlay -->
        <div class="win-overlay hidden" id="win-overlay">
            <h2>You reached 2048!</h2>
            <div class="win-buttons">
                <button class="btn btn-primary" id="btn-continue">Keep Going</button>
                <button class="btn btn-secondary" id="btn-win-menu">Menu</button>
            </div>
        </div>
    </div>

    <!-- Game Screen (2P) -->
    <div id="game-screen-2p" class="screen">
        <div class="game-header">
            <div class="game-header-left">
                <button class="btn-icon" id="btn-back-game-2p" title="Menu">&#8592;</button>
            </div>
            <div class="game-header-center">
                <div class="hud-score p1-label">
                    <span class="hud-label">P1</span>
                    <span class="hud-value" id="hud-score-p1">0</span>
                </div>
                <div class="hud-vs">VS</div>
                <div class="hud-score p2-label">
                    <span class="hud-label">P2</span>
                    <span class="hud-value" id="hud-score-p2">0</span>
                </div>
            </div>
            <div class="game-header-right">
                <button class="btn-icon" id="btn-restart-2p" title="Restart">&#8635;</button>
                <button class="btn-icon shell-theme-toggle" title="Toggle theme"></button>
                <button class="btn-icon shell-sound-toggle" title="Toggle sound"></button>
            </div>
        </div>
        <div class="game-area game-area-2p">
            <div class="grid-wrapper grid-wrapper-2p">
                <div class="player-label p1-label">P1 (WASD)</div>
                <div class="grid-container grid-2p" id="grid-p1">
                    <div class="grid-bg">
                        <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
                        <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
                        <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
                        <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
                    </div>
                    <div class="tile-layer" id="tiles-p1"></div>
                </div>
            </div>
            <div class="grid-wrapper grid-wrapper-2p">
                <div class="player-label p2-label">P2 (Arrows)</div>
                <div class="grid-container grid-2p" id="grid-p2">
                    <div class="grid-bg">
                        <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
                        <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
                        <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
                        <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
                    </div>
                    <div class="tile-layer" id="tiles-p2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen">
        <div class="game-header">
            <div class="game-header-left"></div>
            <div class="game-header-center">
                <span class="game-title-bar">Game Over</span>
            </div>
            <div class="game-header-right">
                <button class="btn-icon shell-theme-toggle" title="Toggle theme"></button>
                <button class="btn-icon shell-sound-toggle" title="Toggle sound"></button>
            </div>
        </div>
        <div class="gameover-content">
            <div class="gameover-title" id="gameover-title">Game Over</div>
            <div class="gameover-stats">
                <div class="stat-row">
                    <span class="stat-label">Score</span>
                    <span class="stat-value" id="go-score">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Best Tile</span>
                    <span class="stat-value" id="go-best-tile">0</span>
                </div>
            </div>
            <div class="gameover-stats hidden" id="go-2p-stats">
                <div class="stat-row">
                    <span class="stat-label p1-label">P1 Score</span>
                    <span class="stat-value" id="go-p1-score">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label p2-label">P2 Score</span>
                    <span class="stat-value" id="go-p2-score">0</span>
                </div>
            </div>
            <div class="gameover-buttons">
                <button class="btn btn-primary" id="btn-play-again">Play Again</button>
                <button class="btn btn-secondary" id="btn-go-menu">Menu</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script src="../shared/audio.js"></script>
    <script src="../shared/game-shell.js"></script>
    <script src="game.js"></script>
</body>
</html>
